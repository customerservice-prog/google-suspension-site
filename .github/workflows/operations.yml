name: ProfilePath external operations
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 3 * * *'
permissions:
  contents: read
jobs:
  health:
    if: vars.PROFILEPATH_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-health.mjs
        env:
          PROFILEPATH_URL: ${{ vars.PROFILEPATH_URL }}
          PROFILEPATH_SITE_ACCESS_TOKEN: ${{ secrets.PROFILEPATH_SITE_ACCESS_TOKEN }}
  encrypted-backup:
    if: vars.PROFILEPATH_OPERATIONS_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/backup-runner.mjs
        env:
          PROFILEPATH_URL: ${{ vars.PROFILEPATH_URL }}
          PROFILEPATH_SITE_ACCESS_TOKEN: ${{ secrets.PROFILEPATH_SITE_ACCESS_TOKEN }}
          PROFILEPATH_BACKUP_TOKEN: ${{ secrets.PROFILEPATH_BACKUP_TOKEN }}
          PROFILEPATH_BACKUP_PASSPHRASE: ${{ secrets.PROFILEPATH_BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-system-backup
          path: private-backups/*.ppbackup
          retention-days: 14
          if-no-files-found: error
